services:
  #########
  # Wazuh #
  #########
  wazuh.manager:
    image: ghcr.io/socfortress/wazuh-manager:${WAZUH_VERSION:-4.14.5}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: wazuh.manager
    hostname: wazuh.manager
    ports:
      - "1514:1514"
      - "1515:1515"
#      - "514:514/udp"
      - "55000:55000"
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
#      - ./wazuh/config/wazuh_cluster/Wazuh-Rules:/tmp/Wazuh-Rules
    env_file: .env
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${WAZUH_USERNAME:-admin}
      - INDEXER_PASSWORD=${WAZUH_PASSWORD:-SecretPassword}
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-ThisIsABadPassword}
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    healthcheck:
      test: [ "CMD-SHELL", "/var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -q 'not running' && exit 1 || exit 0" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.5}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - network.host=0.0.0.0
      - node.name=wazuh.indexer
      - cluster.initial_cluster_manager_nodes=wazuh.indexer
      - node.max_local_storage_nodes=1
      - plugins.security.allow_default_init_securityindex=true
      - NODES_DN=CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_plugins/_security/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.5}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    ports:
      - 5601:5601
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom	  
    environment:
      - SERVER_PORT=5601
      - SERVER_HOST=0.0.0.0
      - OPENSEARCH_HOSTS=https://wazuh.indexer:9200
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=${WAZUH_DASHBOARD_USERNAME:-kibanaserver}
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:-kibanaserver}
      - SERVER_SSL_CERTIFICATE=/usr/share/wazuh-dashboard/config/certs/dashboard.pem
      - SERVER_SSL_KEY=/usr/share/wazuh-dashboard/config/certs/dashboard-key.pem
      - OPENSEARCH_SSL_CERTIFICATE_AUTHORITIES=/usr/share/wazuh-dashboard/config/certs/root-ca.pem
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-k", "-s", "-o", "/dev/null", "https://localhost:5601/login" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ###########
  # Graylog #
  ###########
  # MongoDB: https://hub.docker.com/_/mongo/
  mongodb:
    image: mongo:${MONGODB_VERSION:-7.0}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: mongodb
    hostname: mongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    
  # Graylog: https://hub.docker.com/r/graylog/graylog/
  graylog:
    image: graylog/graylog:${GRAYLOG_VERSION:-6.3}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: graylog
    hostname: graylog
    ports:
      # Graylog web interface and REST API
      - 9000:9000
      # Syslog TCP (Disabled for compatibility with the Wazuh Manager)
      # - 1514:1514
      # Syslog UDP SophosFW
      - 514:514/udp
      # Syslog UDP SophosFW
      - 2514:2514/udp
      # GELF TCP
      - 12201:12201
      # GELF UDP
      - 12201:12201/udp
    volumes:
      - graylog_data:/usr/share/graylog/data
      - ./graylog/graylog.conf:/usr/share/graylog/data/config/graylog.conf
      - ./graylog/log4j2.xml:/usr/share/graylog/data/config/log4j2.xml
      - ./graylog/root-ca.pem:/usr/share/graylog/data/config/root-ca.pem
      - ./graylog/GeoLite2-City.mmdb:/usr/share/graylog/data/config//GeoLite2-City.mmdb
      - ./graylog/GeoLite2-ASN.mmdb:/usr/share/graylog/data/config/GeoLite2-ASN.mmdb
      - ./config/network_ports.csv:/etc/graylog/network_ports.csv
      - ./config/software_vendors.csv:/etc/graylog/software_vendors.csv
    environment:
      GRAYLOG_NODE_ID_FILE: "/usr/share/graylog/data/data/node-id"
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:-GraylogPassword}"
      GRAYLOG_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2:-GraylogRootPasswordSHA2}"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://graylog:9000/"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    depends_on:
      mongodb:
        condition: "service_started"
      wazuh.indexer:
        condition: service_healthy
    restart: unless-stopped

  ###########
  # Grafana #
  ###########
  grafana:
    image: grafana/grafana-enterprise:${GRAFANA_VERSION:-12.3.3}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: grafana
    hostname: grafana
    ports:
      - 3000:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
    restart: unless-stopped

  ################
  # Velociraptor #
  ################
  velociraptor:
    image: wlambert/velociraptor:${VELOCIRAPTOR_VERSION:-0.75.6}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: velociraptor
    hostname: velociraptor
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8889:8889"
    volumes:
      - velociraptor:/velociraptor/:rw
    env_file: .env
    environment:
      - VELOX_USER=${VELOX_USER}
      - VELOX_PASSWORD=${VELOX_PASSWORD}
      - VELOX_ROLE=${VELOX_ROLE}
      - VELOX_SERVER_URL=${VELOX_SERVER_URL}
      - VELOX_FRONTEND_HOSTNAME=${VELOX_FRONTEND_HOSTNAME}

  ###########
  # CoPilot #
  ###########
  copilot-backend:
    image: ghcr.io/socfortress/copilot-backend:latest
    pull_policy: ${PULL_POLICY:-daily}
    container_name: copilot-backend
    hostname: copilot-backend
    # Expose the Ports for Graylog Alerting and Docs
    ports:
      - "5000:5000"
    volumes:
      - copilot-logs:/opt/logs
      # Mount the copilot.db file to persist the database
      - copilot-data:/opt/copilot/backend/data
    env_file: .env
    depends_on:
      copilot-mysql:
        condition: "service_started"
    restart: unless-stopped

  copilot-frontend:
    image: ghcr.io/socfortress/copilot-frontend:latest
    pull_policy: ${PULL_POLICY:-daily}
    container_name: copilot-frontend
    hostname: copilot-frontend
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    environment:
      - SERVER_HOST=${SERVER_HOST:-localhost} # Set the domain name of your server
    depends_on:
      copilot-backend:
        condition: "service_started"
    restart: unless-stopped

  copilot-mysql:
    image: mysql:${MYSQL_VERSION:-8.0.46-debian}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: copilot-mysql
    hostname: copilot-mysql
    volumes:
      - copilot-mysql_data:/var/lib/mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-WeakPasswordThatShouldNotBeUsed}
      MYSQL_DATABASE: copilot
      MYSQL_USER: ${MYSQL_USER:}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: unless-stopped

  copilot-minio:
    image: ${MINIO_RELEASE:-ghcr.io/socfortress/minio:release.2024-09-13t20-26-02z}
    pull_policy: ${PULL_POLICY:-daily}
    container_name: copilot-minio
    hostname: copilot-minio
    command: server /data --console-address ":9001"
    volumes:
      - copilot_minio-data:/data
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  copilot-nuclei-module:
    image: ghcr.io/socfortress/copilot-nuclei-module:latest
    pull_policy: ${PULL_POLICY:-daily}
    container_name: copilot-nuclei-module
    restart: unless-stopped

volumes:
  # Wazuh
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  fluent-bit:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  # Graylog
  mongodb_data:
  mongodb_config:
  graylog_data:
  # Grafana
  grafana-storage:
  # Velociraptor
  velociraptor:
  # CoPilot
  copilot-logs:
  copilot-data:
  copilot-mysql_data:
  copilot_minio-data: